name: "neon-csat3b-average"
version: "0.1.3"
description: "Publishes 30-minute rolling averages of NEON CSAT3B sonic anemometer data read from the sage-kafka mirror."
keywords: "neon, kafka, csat3b, sonic anemometer, wind, eddy covariance, rolling average"
namespace: "iperezx"
authors: "Ismael Perez <i3perez@sdsc.edu>"
collaborators: ""
funding: 'NSF 1935984'
license: "MIT license"
homepage: "https://github.com/sagecontinuum/neon-csat3b-average"
source:
  architectures:
    - "linux/amd64"
    - "linux/arm64"
inputs:
  - id: "kafka"
    type: "string"
  - id: "topic"
    type: "string"
  - id: "window-minutes"
    type: "float"
  - id: "interval-minutes"
    type: "float"
  - id: "once"
    type: "boolean"
  - id: "time-field"
    type: "string"
  - id: "fields"
    type: "string"
  - id: "group-by"
    type: "string"
  - id: "prefix"
    type: "string"
  - id: "lookback-margin-minutes"
    type: "float"
  - id: "max-messages"
    type: "int"
  - id: "registry-url"
    type: "string"
  - id: "registry-ip"
    type: "string"
  - id: "value-format"
    type: "string"

